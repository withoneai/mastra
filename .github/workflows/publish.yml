name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing, as in withoneai/cli
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm check
      - run: npm publish --access public --provenance
