<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">@withone/mastra</title>
  <desc id="desc">Gmail, Slack, Linear, HubSpot, Stripe and 1000+ more apps flow through One into Mastra as oneTools, oneStep and oneTrigger. Install with npm i @withone/mastra.</desc>
  <defs>
    <!-- Data-flow gradient: the only colour on the canvas, used on the wires alone -->
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="828" y1="0" x2="932" y2="0">
      <stop offset="0" stop-color="#232324"/>
      <stop offset="0.55" stop-color="#f6d1ac" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="640" y="0">
      <path d="M40 0H0V40" fill="none" stroke="#141415" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="400" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#000000"/>
    <!-- Grid on the right half, fading in from the divider -->
    <rect x="640" y="0" width="640" height="400" fill="url(#grid)"/>
    <rect x="640" y="0" width="640" height="400" fill="url(#fade)"/>
    <path d="M640.5 0V400" stroke="#232324"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="15.5" fill="none" stroke="#232324"/>

  <!-- Left: tag, name, pitch, install -->
  <rect x="64" y="72" width="146" height="28" rx="14" fill="#141516" stroke="#232324"/>
  <circle cx="81" cy="86" r="3" fill="#f6d1ac"/>
  <text x="93" y="90.5" font-size="13" fill="#fafafa" font-weight="500">Mastra × One</text>

  <text class="mono" x="62" y="168" font-size="52" font-weight="500" fill="#fafafa" letter-spacing="-2">@withone/mastra</text>
  <text x="64" y="214" font-size="20" fill="#a1a1aa" letter-spacing="-0.2">The apps you've connected on One, as tools,</text>
  <text x="64" y="242" font-size="20" fill="#a1a1aa" letter-spacing="-0.2">workflow steps and triggers for Mastra agents.</text>

  <rect x="64" y="288" width="292" height="44" rx="8" fill="#0a0a0b" stroke="#232324"/>
  <text class="mono" x="84" y="315" font-size="15" fill="#5c5c61">$</text>
  <text class="mono" x="102" y="315" font-size="15" fill="#fafafa">npm i @withone/mastra</text>
  <text x="380" y="315" font-size="14" fill="#5c5c61">No OAuth code. No provider SDKs.</text>

  <!-- Wires: apps → One (data flow) -->
  <g fill="none" stroke="url(#flow)" stroke-width="1.25">
    <path d="M828 80  C880 80  880 200 932 200"/>
    <path d="M828 132 C880 132 880 200 932 200"/>
    <path d="M828 184 C880 184 880 200 932 200"/>
    <path d="M828 236 C880 236 880 200 932 200"/>
    <path d="M828 288 C880 288 880 200 932 200"/>
  </g>
  <!-- One → Mastra -->
  <path d="M1032 200H1072" stroke="#fafafa" stroke-width="1.25"/>
  <circle cx="1072" cy="200" r="3" fill="#fafafa"/>

  <!-- App grid cells -->
  <g font-size="14" fill="#fafafa">
    <rect x="688" y="62"  width="140" height="36" rx="8" fill="#000" stroke="#232324"/>
    <text x="706" y="85">Gmail</text>
    <rect x="688" y="114" width="140" height="36" rx="8" fill="#000" stroke="#232324"/>
    <text x="706" y="137">Slack</text>
    <rect x="688" y="166" width="140" height="36" rx="8" fill="#000" stroke="#232324"/>
    <text x="706" y="189">Linear</text>
    <rect x="688" y="218" width="140" height="36" rx="8" fill="#000" stroke="#232324"/>
    <text x="706" y="241">HubSpot</text>
    <rect x="688" y="270" width="140" height="36" rx="8" fill="#000" stroke="#232324"/>
    <text x="706" y="293">Stripe</text>
  </g>
  <rect x="688" y="322" width="140" height="36" rx="8" fill="none" stroke="#232324" stroke-dasharray="3 4"/>
  <text class="mono" x="758" y="345" font-size="13" fill="#a1a1aa" text-anchor="middle">1000+ more</text>

  <!-- One: the single high-contrast filled element -->
  <rect x="932" y="164" width="100" height="72" rx="36" fill="#fafafa"/>
  <text x="982" y="199" font-size="22" font-weight="600" fill="#000" text-anchor="middle" letter-spacing="-0.5">One</text>
  <text x="982" y="218" font-size="11" fill="#5c5c61" text-anchor="middle">auth · actions</text>

  <!-- Mastra card -->
  <rect x="1072" y="132" width="152" height="136" rx="8" fill="#0a0a0b" stroke="#232324"/>
  <path d="M1072.5 168H1223.5" stroke="#232324"/>
  <text x="1090" y="156" font-size="15" font-weight="500" fill="#fafafa" letter-spacing="-0.2">Mastra</text>
  <g font-size="12.5" fill="#a1a1aa">
    <text class="mono" x="1090" y="194">oneTools()</text>
    <text class="mono" x="1090" y="220">oneStep()</text>
    <text class="mono" x="1090" y="246">oneTrigger()</text>
  </g>
</svg>
